stages:
  - test

variables:
  GOTOOLCHAIN: "local"
  GOPATH: "$CI_PROJECT_DIR/.cache/go"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/go/pkg/mod/

hmi_core_tests:
  stage: test
  image: golang:1.26
  script:
    - go test ./internal/mcp ./internal/model ./internal/sysmac ./internal/waterjet ./functions -count=1
